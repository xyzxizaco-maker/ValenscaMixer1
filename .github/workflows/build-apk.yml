
name: Build Valensca Mixer APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Gradle manually
        run: |
          curl -fL --retry 5 --retry-all-errors --retry-delay 10 \
            https://services.gradle.org/distributions/gradle-8.9-bin.zip \
            -o "$RUNNER_TEMP/gradle.zip"
          mkdir -p "$RUNNER_TEMP/gradle"
          unzip -q "$RUNNER_TEMP/gradle.zip" -d "$RUNNER_TEMP/gradle"
          echo "$RUNNER_TEMP/gradle/gradle-8.9/bin" >> "$GITHUB_PATH"

      - name: Extract project ZIP
        run: unzip -o ValenscaMixerAndroid_BuildReady.zip

      - name: Build Android APK
        working-directory: ValenscaMixerAndroid
        run: gradle --no-daemon :app:assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ValenscaMixer-debug-apk
          path: ValenscaMixerAndroid/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
