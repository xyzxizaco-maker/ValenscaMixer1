
name: Build Valensca Mixer APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Extract project ZIP
  run: |
    unzip -o ValenscaMixerAndroid_BuildReady.zip
      - name: Build Android APK
  working-directory: ValenscaMixerAndroid
  run: |
    gradle --no-daemon assembleDebug
          if [ -f gradlew ]; then
            chmod +x gradlew
            ./gradlew --no-daemon assembleDebug
          else
            gradle --no-daemon assembleDebug
          fi

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ValenscaMixer-APK
          path: ValenscaMixerAndroid/**/build/outputs/apk/debug/*.apk
          if-no-files-found: error
