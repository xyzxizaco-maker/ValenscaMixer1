
name: Build Valensca Mixer APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Extract project ZIP
        run: unzip -o ValenscaMixerAndroid_BuildReady.zip

      - name: Fix Java Kotlin JVM target
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path("ValenscaMixerAndroid/app/build.gradle.kts")
          s = p.read_text()
          s = s.replace(
              '    kotlinOptions { jvmTarget = "17" }',
              '''    compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }

              kotlinOptions {
                  jvmTarget = "17"
              }'''
          )
          p.write_text(s)
          PY
      - name: Build Android APK
        working-directory: ValenscaMixerAndroid
        run: gradle --no-daemon assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ValenscaMixer-APK
          path: ValenscaMixerAndroid/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
